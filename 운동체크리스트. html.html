<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3FB">
<title>매일 운동 체크</title>
<style>
:root{
  --bg:#F1F3FB;
  --card:#FFFFFF;
  --ink:#151936;
  --sub:#6B7192;
  --line:#E4E8F5;
  --soft:#EEF0F9;
  --swim:#1F7BFF;
  --run:#FF5A2C;
  --push:#7B4DFF;
  --hang:#00B58E;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;touch-action:manipulation}
input{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 40px)}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.03em;min-width:5.6em;text-align:center}
.nav-btn{width:42px;height:42px;border-radius:50%;background:var(--card);font-size:22px;font-weight:700;display:grid;place-items:center;box-shadow:0 1px 0 var(--line)}
.nav-btn:active{transform:scale(.92)}
.today-btn{height:42px;padding:0 16px;border-radius:21px;background:var(--ink);color:#fff;font-weight:800;font-size:15px}
.today-btn:active{transform:scale(.95)}

/* 날짜 스트립 */
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 12px;margin:0 -14px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:54px;padding:9px 0 9px;border-radius:18px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:3px;scroll-snap-align:center;box-shadow:0 1px 0 var(--line)}
.day .wd{font-size:12px;font-weight:700;color:var(--sub)}
.day .dn{font-size:21px;font-weight:900;letter-spacing:-.02em}
.day .dots{display:grid;grid-template-columns:repeat(2,6px);gap:3px;margin-top:2px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day.sel{background:var(--ink);color:#fff;box-shadow:none}
.day.sel .wd{color:#B9BEDD}
.day.sel .dots i{background:#3A3F68}
.day .dots i.on{background:var(--c)}

/* 카드 공통 */
.card{background:var(--card);border-radius:var(--r);padding:18px 16px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.card h2{margin:0;font-size:18px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.chip-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--tint)}

/* 오늘 기록 */
.rec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.rec-date{font-size:24px;font-weight:900;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:800;background:var(--ink);color:#fff;border-radius:10px;padding:3px 8px}
.rec-msg{font-size:14px;color:var(--sub);margin-top:3px;font-weight:600}
.ring{position:relative;width:58px;height:58px;flex:0 0 auto}
.ring svg{width:58px;height:58px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--soft)}
.ring .fg{stroke:var(--ink);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900}
.ring.full .fg{stroke:var(--hang)}

.item{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--soft);margin-top:10px;transition:background .2s}
.item .ico{width:46px;height:46px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.item .lab{flex:1;min-width:0}
.item .lab b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em}
.item .lab span{font-size:13px;color:var(--sub);font-weight:600}
.toggle{width:36px;height:36px;border-radius:11px;background:#fff;display:grid;place-items:center;flex:0 0 auto;margin-right:4px;box-shadow:inset 0 0 0 2.5px #C9CEE6;transition:transform .15s,background .15s}
.toggle svg{width:24px;height:24px;stroke:transparent;fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.item.tg:active .toggle{transform:scale(.9)}
.item.tg.done{background:color-mix(in srgb,var(--c) 14%,#fff)}
.item.tg.done .toggle{background:var(--c);box-shadow:none}
.item.tg.done .toggle svg{stroke:#fff}
.item.tg{cursor:pointer}

.item.num{flex-wrap:wrap}
.item.num.done{background:color-mix(in srgb,var(--c) 14%,#fff)}
.stepper{display:flex;align-items:center;gap:8px;width:100%;margin-top:2px}
.step{width:52px;height:52px;border-radius:16px;background:#fff;font-size:26px;font-weight:800;display:grid;place-items:center;box-shadow:inset 0 0 0 2px var(--line)}
.step:active{transform:scale(.92)}
.step.plus{background:var(--c);color:#fff;box-shadow:none}
.numbox{flex:1;min-width:0;height:52px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 0 0 2px var(--line)}
.numbox:focus-within{box-shadow:inset 0 0 0 2px var(--c)}
.numbox input{width:100%;min-width:0;border:0;outline:0;background:none;text-align:right;font-size:26px;font-weight:900;letter-spacing:-.02em;padding:0 0 0 8px;-moz-appearance:textfield}
.numbox input::-webkit-outer-spin-button,.numbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numbox em{font-style:normal;font-size:15px;font-weight:800;color:var(--sub);padding-right:12px;flex:0 0 auto}
.quick{display:flex;gap:8px;width:100%}
.quick button{flex:1;height:38px;border-radius:12px;background:#fff;font-weight:800;font-size:14px;color:var(--c);box-shadow:inset 0 0 0 2px var(--line)}
.quick button:active{transform:scale(.95)}

/* 통계 */
.stats{display:flex;gap:8px;margin:14px 0 6px}
.stat{flex:1;background:var(--soft);border-radius:14px;padding:10px 10px}
.stat span{display:block;font-size:12px;color:var(--sub);font-weight:700}
.stat b{display:block;font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.stat b small{font-size:12px;font-weight:800;color:var(--sub);margin-left:2px}

/* 차트 */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .ax{font-size:9.5px;fill:var(--sub);font-weight:700}
.chart .axt{font-size:9.5px;fill:var(--ink);font-weight:900}
.chart .band{fill:var(--soft)}
.chart .val{font-size:11px;font-weight:900;fill:var(--ink)}
.chart .hit{fill:transparent;cursor:pointer}

/* 일수 카드 */
.count-row{display:flex;align-items:baseline;gap:6px;margin:14px 0 10px}
.count-row .big{font-size:46px;font-weight:900;letter-spacing:-.04em;line-height:1;color:var(--c)}
.count-row .of{font-size:16px;font-weight:800;color:var(--sub)}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-bottom:14px}
.meter i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .4s ease}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 0;justify-items:center}
.dgrid .h{font-size:11px;font-weight:800;color:var(--sub);padding-bottom:2px}
.dg{width:36px;height:36px;border-radius:50%;font-size:13px;font-weight:800;background:var(--soft);color:var(--sub);display:grid;place-items:center}
.dg.done{background:var(--c);color:#fff}
.dg.today{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.dg.sel:not(.done){background:var(--ink);color:#fff}
.dg.sel.done{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.dg:active{transform:scale(.9)}

.foot{text-align:center;color:var(--sub);font-size:12px;font-weight:600;margin-top:18px;line-height:1.6}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="month-nav">
      <button class="nav-btn" id="prev" aria-label="이전 달">‹</button>
      <h1 id="title"></h1>
      <button class="nav-btn" id="next" aria-label="다음 달">›</button>
    </div>
    <button class="today-btn" id="goToday">오늘</button>
  </header>

  <div class="strip" id="strip" aria-label="날짜 선택"></div>

  <!-- 기록 카드 -->
  <section class="card" id="rec">
    <div class="rec-head">
      <div>
        <div class="rec-date"><span id="recDate"></span><span class="badge" id="recBadge" hidden>오늘</span></div>
        <div class="rec-msg" id="recMsg"></div>
      </div>
      <div class="ring" id="ring">
        <svg viewBox="0 0 58 58"><circle class="bg" cx="29" cy="29" r="24"/><circle class="fg" id="ringFg" cx="29" cy="29" r="24" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg>
        <b id="ringTxt">0/4</b>
      </div>
    </div>

    <div class="item tg" id="itSwim" style="--c:var(--swim)" role="checkbox" tabindex="0" aria-checked="false">
      <div class="ico">🏊</div>
      <div class="lab"><b>수영</b><span>오늘 했으면 체크</span></div>
      <div class="toggle"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    </div>

    <div class="item num" id="itRun" style="--c:var(--run)">
      <div class="ico">🏃</div>
      <div class="lab"><b>달리기</b><span>몇 km 달렸나요?</span></div>
      <div class="stepper">
        <button class="step" id="runMinus" aria-label="1km 줄이기">−</button>
        <label class="numbox"><input id="runInp" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0"><em>km</em></label>
        <button class="step plus" id="runPlus" aria-label="1km 늘리기">+</button>
      </div>
    </div>

    <div class="item num" id="itPush" style="--c:var(--push)">
      <div class="ico">💪</div>
      <div class="lab"><b>푸시업</b><span>몇 개 했나요?</span></div>
      <div class="stepper">
        <button class="step" id="pushMinus" aria-label="10개 줄이기">−</button>
        <label class="numbox"><input id="pushInp" type="number" inputmode="numeric" min="0" step="1" placeholder="0"><em>개</em></label>
        <button class="step plus" id="pushPlus" aria-label="10개 늘리기">+</button>
      </div>
      <div class="quick">
        <button id="pushP1">+1</button>
        <button id="pushP5">+5</button>
      </div>
    </div>

    <div class="item tg" id="itHang" style="--c:var(--hang)" role="checkbox" tabindex="0" aria-checked="false">
      <div class="ico">🧗</div>
      <div class="lab"><b>매달리기</b><span>오늘 했으면 체크</span></div>
      <div class="toggle"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    </div>
  </section>

  <!-- 달리기 그래프 -->
  <section class="card chart" style="--c:var(--run);--tint:#FFE9E1">
    <h2><span class="chip-ico">🏃</span>달리기 거리</h2>
    <div class="stats" id="runStats"></div>
    <div id="runChart"></div>
  </section>

  <!-- 푸시업 그래프 -->
  <section class="card chart" style="--c:var(--push);--tint:#EFE8FF">
    <h2><span class="chip-ico">💪</span>푸시업 개수</h2>
    <div class="stats" id="pushStats"></div>
    <div id="pushChart"></div>
  </section>

  <!-- 수영 -->
  <section class="card" style="--c:var(--swim);--tint:#E2EEFF">
    <h2><span class="chip-ico">🏊</span>수영한 날</h2>
    <div class="count-row"><span class="big" id="swimBig">0</span><span class="of" id="swimOf"></span></div>
    <div class="meter"><i id="swimMeter"></i></div>
    <div class="dgrid" id="swimGrid"></div>
  </section>

  <!-- 매달리기 -->
  <section class="card" style="--c:var(--hang);--tint:#DDF6EE">
    <h2><span class="chip-ico">🧗</span>매달리기 한 날</h2>
    <div class="count-row"><span class="big" id="hangBig">0</span><span class="of" id="hangOf"></span></div>
    <div class="meter"><i id="hangMeter"></i></div>
    <div class="dgrid" id="hangGrid"></div>
  </section>

  <div class="foot">기록은 이 기기의 브라우저에 자동 저장돼요.<br>새로고침하거나 브라우저를 껐다 켜도 그대로 남아요.</div>
</div>

<script>
(function(){
  'use strict';

  /* ---------- 저장소 (localStorage, 실패 시 메모리) ---------- */
  var KEY = 'workout-checklist-v1';
  var store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ store = {}; }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

  /* ---------- 날짜 유틸 ---------- */
  var WD = ['일','월','화','수','목','금','토'];
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  var key = function(y,m,d){ return y + '-' + pad(m+1) + '-' + pad(d); };
  var dim = function(y,m){ return new Date(y, m+1, 0).getDate(); };
  var now = new Date();
  var T = { y: now.getFullYear(), m: now.getMonth(), d: now.getDate() };
  var st = { y: T.y, m: T.m, d: T.d };
  var isToday = function(y,m,d){ return y===T.y && m===T.m && d===T.d; };

  var COLORS = { swim:'var(--swim)', run:'var(--run)', push:'var(--push)', hang:'var(--hang)' };

  function get(k){ return store[k] || {}; }
  function set(k, patch){
    var o = Object.assign({}, store[k] || {}, patch);
    var empty = !o.swim && !o.hang && !(o.run > 0) && !(o.push > 0);
    if (empty) delete store[k]; else store[k] = o;
    save();
  }
  var curKey = function(){ return key(st.y, st.m, st.d); };

  /* ---------- 요소 ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var runInp = $('runInp'), pushInp = $('pushInp');

  /* ---------- 날짜 스트립 ---------- */
  function renderStrip(center){
    var el = $('strip');
    var prev = el.scrollLeft;
    var n = dim(st.y, st.m), h = '';
    for (var d = 1; d <= n; d++){
      var e = get(key(st.y, st.m, d));
      var w = new Date(st.y, st.m, d).getDay();
      var cls = 'day' + (d===st.d ? ' sel' : '') + (isToday(st.y,st.m,d) ? ' today' : '');
      h += '<button class="'+cls+'" data-d="'+d+'" aria-label="'+(st.m+1)+'월 '+d+'일">' +
        '<span class="wd">'+WD[w]+'</span><span class="dn">'+d+'</span>' +
        '<span class="dots">' +
          '<i class="'+(e.swim?'on':'')+'" style="--c:'+COLORS.swim+'"></i>' +
          '<i class="'+(e.run>0?'on':'')+'" style="--c:'+COLORS.run+'"></i>' +
          '<i class="'+(e.push>0?'on':'')+'" style="--c:'+COLORS.push+'"></i>' +
          '<i class="'+(e.hang?'on':'')+'" style="--c:'+COLORS.hang+'"></i>' +
        '</span></button>';
    }
    el.innerHTML = h;
    if (center){
      var s = el.querySelector('.sel');
      if (s) el.scrollLeft = s.offsetLeft - (el.clientWidth - s.offsetWidth)/2;
    } else {
      el.scrollLeft = prev;
    }
  }

  /* ---------- 기록 카드 동기화 ---------- */
  var setNum = function(inp, v){
    if (document.activeElement === inp) return;
    inp.value = v > 0 ? String(v) : '';
  };
  function syncRecord(){
    var e = get(curKey());
    var w = new Date(st.y, st.m, st.d).getDay();
    $('recDate').textContent = (st.m+1) + '월 ' + st.d + '일 (' + WD[w] + ')';
    $('recBadge').hidden = !isToday(st.y, st.m, st.d);

    $('itSwim').classList.toggle('done', !!e.swim);
    $('itSwim').setAttribute('aria-checked', !!e.swim);
    $('itHang').classList.toggle('done', !!e.hang);
    $('itHang').setAttribute('aria-checked', !!e.hang);
    $('itRun').classList.toggle('done', e.run > 0);
    $('itPush').classList.toggle('done', e.push > 0);
    setNum(runInp, e.run || 0);
    setNum(pushInp, e.push || 0);

    var c = (e.swim?1:0) + (e.run>0?1:0) + (e.push>0?1:0) + (e.hang?1:0);
    $('ringTxt').textContent = c + '/4';
    $('ringFg').setAttribute('stroke-dashoffset', String(150.8 * (1 - c/4)));
    $('ring').classList.toggle('full', c === 4);
    $('recMsg').textContent = c === 0 ? '기록을 시작해볼까요?' :
                              c === 4 ? '네 가지 모두 완료! 🎉' : (4 - c) + '개 남았어요';
  }

  /* ---------- 막대그래프 (SVG) ---------- */
  function niceMax(v){
    if (v <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / p;
    var c = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
    return c * p;
  }
  var r1 = function(x){ return Math.round(x*10)/10; };

  function monthVals(field){
    var n = dim(st.y, st.m), a = [];
    for (var d = 1; d <= n; d++) a.push(get(key(st.y, st.m, d))[field] || 0);
    return a;
  }

  function barChart(field, color, unit){
    var vals = monthVals(field), n = vals.length;
    var mx = niceMax(Math.max.apply(null, vals));
    var W = 340, H = 176, L = 30, R = 6, TT = 18, B = 24;
    var pw = W - L - R, ph = H - TT - B, slot = pw / n, bw = Math.max(3, slot * 0.62);
    var s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(st.m+1)+'월 '+field+' 그래프">';

    [0, .5, 1].forEach(function(f){
      var yy = TT + ph * (1 - f);
      s += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/>' +
           '<text class="ax" x="'+(L-6)+'" y="'+(yy+3)+'" text-anchor="end">'+r1(mx*f)+'</text>';
    });

    for (var d = 1; d <= n; d++){
      var v = vals[d-1];
      var sx = L + slot * (d-1);
      var x = sx + (slot - bw) / 2;
      var hh = v > 0 ? Math.max(3, ph * v / mx) : 0;
      var isSel = d === st.d;
      if (isSel) s += '<rect class="band" x="'+sx+'" y="'+(TT-6)+'" width="'+slot+'" height="'+(ph+6)+'" rx="4"/>';
      if (v > 0){
        s += '<rect x="'+x+'" y="'+(TT+ph-hh)+'" width="'+bw+'" height="'+hh+'" rx="'+Math.min(bw/2,3.5)+'" fill="'+color+'"/>';
      } else {
        s += '<rect x="'+x+'" y="'+(TT+ph-2)+'" width="'+bw+'" height="2" rx="1" fill="#DDE1F0"/>';
      }
      if (isSel && v > 0){
        s += '<text class="val" x="'+(sx+slot/2)+'" y="'+(TT+ph-hh-5)+'" text-anchor="middle">'+r1(v)+'</text>';
      }
      if (d === 1 || d % 5 === 0){
        s += '<text class="'+(isToday(st.y,st.m,d)||isSel?'axt':'ax')+'" x="'+(sx+slot/2)+'" y="'+(H-7)+'" text-anchor="middle">'+d+'</text>';
      }
      s += '<rect class="hit" data-d="'+d+'" x="'+sx+'" y="0" width="'+slot+'" height="'+(H-B+10)+'"/>';
    }
    return s + '</svg>';
  }

  function renderStats(id, field, unit){
    var vals = monthVals(field);
    var total = 0, days = 0, best = 0;
    vals.forEach(function(v){ if (v > 0){ total += v; days++; if (v > best) best = v; } });
    $(id).innerHTML =
      '<div class="stat"><span>이번 달 합계</span><b>'+r1(total)+'<small>'+unit+'</small></b></div>' +
      '<div class="stat"><span>운동한 날</span><b>'+days+'<small>일</small></b></div>' +
      '<div class="stat"><span>하루 최고</span><b>'+r1(best)+'<small>'+unit+'</small></b></div>';
  }

  /* ---------- 일수 달력 (수영 / 매달리기) ---------- */
  function dayGrid(gridId, bigId, ofId, meterId, field){
    var n = dim(st.y, st.m), first = new Date(st.y, st.m, 1).getDay(), cnt = 0, h = '';
    WD.forEach(function(w){ h += '<div class="h">'+w+'</div>'; });
    for (var i = 0; i < first; i++) h += '<div></div>';
    for (var d = 1; d <= n; d++){
      var on = !!get(key(st.y, st.m, d))[field];
      if (on) cnt++;
      h += '<button class="dg'+(on?' done':'')+(d===st.d?' sel':'')+(isToday(st.y,st.m,d)?' today':'')+'" data-d="'+d+'">'+d+'</button>';
    }
    $(gridId).innerHTML = h;
    $(bigId).textContent = cnt + '일';
    $(ofId).textContent = '/ ' + n + '일';
    $(meterId).style.width = (cnt / n * 100) + '%';
  }

  /* ---------- 전체 갱신 ---------- */
  function refresh(center){
    $('title').textContent = st.y + '년 ' + (st.m+1) + '월';
    renderStrip(center);
    syncRecord();
    $('runChart').innerHTML  = barChart('run',  COLORS.run,  'km');
    $('pushChart').innerHTML = barChart('push', COLORS.push, '개');
    renderStats('runStats',  'run',  'km');
    renderStats('pushStats', 'push', '개');
    dayGrid('swimGrid', 'swimBig', 'swimOf', 'swimMeter', 'swim');
    dayGrid('hangGrid', 'hangBig', 'hangOf', 'hangMeter', 'hang');
  }

  /* ---------- 날짜 이동 ---------- */
  function pick(d){ st.d = d; refresh(true); }
  function moveMonth(delta){
    var dt = new Date(st.y, st.m + delta, 1);
    st.y = dt.getFullYear(); st.m = dt.getMonth();
    st.d = isToday(st.y, st.m, T.d) || (st.y===T.y && st.m===T.m) ? T.d : Math.min(st.d, dim(st.y, st.m));
    refresh(true);
  }
  $('prev').onclick = function(){ moveMonth(-1); };
  $('next').onclick = function(){ moveMonth(1); };
  $('goToday').onclick = function(){ st.y = T.y; st.m = T.m; st.d = T.d; refresh(true); };

  $('strip').addEventListener('click', function(ev){
    var b = ev.target.closest('.day'); if (b) pick(+b.dataset.d);
  });
  ['runChart','pushChart'].forEach(function(id){
    $(id).addEventListener('click', function(ev){
      var r = ev.target.closest('.hit'); if (r) pick(+r.dataset.d);
    });
  });
  ['swimGrid','hangGrid'].forEach(function(id){
    $(id).addEventListener('click', function(ev){
      var b = ev.target.closest('.dg'); if (b) pick(+b.dataset.d);
    });
  });

  /* ---------- 기록 입력 ---------- */
  function toggle(id, field){
    var el = $(id);
    var fn = function(){ var e = get(curKey()); var p = {}; p[field] = !e[field]; set(curKey(), p); refresh(false); };
    el.addEventListener('click', fn);
    el.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); fn(); } });
  }
  toggle('itSwim', 'swim');
  toggle('itHang', 'hang');

  function bump(field, delta, dec){
    var cur = get(curKey())[field] || 0;
    var v = Math.max(0, Math.round((cur + delta) * 10) / 10);
    if (!dec) v = Math.round(v);
    if (v > 999) v = 999;
    var p = {}; p[field] = v; set(curKey(), p);
    (field === 'run' ? runInp : pushInp).blur();
    refresh(false);
  }
  $('runMinus').onclick  = function(){ bump('run', -1, true); };
  $('runPlus').onclick   = function(){ bump('run',  1, true); };
  $('pushMinus').onclick = function(){ bump('push', -10, false); };
  $('pushPlus').onclick  = function(){ bump('push',  10, false); };
  $('pushP1').onclick    = function(){ bump('push',  1, false); };
  $('pushP5').onclick    = function(){ bump('push',  5, false); };

  function typed(inp, field, dec){
    inp.addEventListener('input', function(){
      var v = parseFloat(inp.value);
      if (isNaN(v) || v < 0) v = 0;
      v = dec ? Math.round(v * 10) / 10 : Math.round(v);
      if (v > 999) v = 999;
      var p = {}; p[field] = v; set(curKey(), p);
      refresh(false);
    });
    inp.addEventListener('blur', function(){ syncRecord(); });
    inp.addEventListener('keydown', function(ev){ if (ev.key === 'Enter') inp.blur(); });
    inp.addEventListener('focus', function(){ setTimeout(function(){ try{ inp.select(); }catch(e){} }, 0); });
  }
  typed(runInp, 'run', true);
  typed(pushInp, 'push', false);

  refresh(true);
})();
</script>
</body>
</html>
